[project]
name = "turbocluster"
authors = [
    { name="Lorenzo Maria Perrone", email="lorenzolmp@protonmail.com" },
]
readme = "README.md"
requires-python = ">=3.14.0"
classifiers = [
    "Programming Language :: Python :: 3.14",
]

dynamic = ["dependencies", "optional-dependencies", "description", "version"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.cibuildwheel]
before-all = "uname -a"
